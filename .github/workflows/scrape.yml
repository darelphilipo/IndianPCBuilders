name: Daily Nehru Place Scraper

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Scraper with Unbuffered Logging
        env:
          PYTHONUNBUFFERED: "1"
        run: python scrape.py

      - name: Commit and push single CSV
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          git add data/nehru_place_prices.csv

          if ! git diff-index --quiet HEAD; then
            git commit -m "chore(data): automated daily refresh of nehru_place_prices.csv"
            git push
          else
            echo "No price updates detected today."
          fi
